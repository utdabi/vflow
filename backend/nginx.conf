# nginx.conf — VolunteerFlow API reverse proxy
#
# INSTALLATION (on EC2):
#   sudo cp nginx.conf /etc/nginx/sites-available/api
#   sudo ln -s /etc/nginx/sites-available/api /etc/nginx/sites-enabled/api
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# REPLACE:  api.yourdomain.com  →  your actual API subdomain

server {
    listen 80;
    server_name api.yourdomain.com;

    # Security headers (Cloudflare proxy strips X-Frame-Options for Pages,
    # but keep them here as defence-in-depth for direct API consumers)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Forward all requests to the FastAPI container on localhost
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Pass real client IP through Cloudflare
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $http_x_forwarded_proto;

        # Timeouts — increase if your backup-finder endpoint is slow
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
