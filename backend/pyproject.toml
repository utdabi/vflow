[project]
name = "volunteerflow-backend"
version = "0.1.0"
description = "VolunteerFlow Backup Finder — FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "launchdarkly-server-sdk>=9.4.0",
    "twilio>=9.2.0",
    "sentry-sdk[fastapi]>=2.8.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
